bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 10s 内必须走满 0.5m，对 0.5m/s 的底盘在窄处或转弯时太苛刻，
      # 容易误判"卡住"而 abort。放宽到 0.3m / 15s。
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 原 0.25/0.25 是 TurtleBot 默认，5cm 网格下太松：
      # 差 25cm 就报"到了"，实际离目标还很远。
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # 允许小幅倒车：车头正对墙卡住时 DWB 能采样后退轨迹脱困，
      # 而不是只会原地打转。0.0 时完全没有退路。
      min_vel_x: -0.10
      min_vel_y: 0.0
      # 底盘实际能到 0.5，但 S 弯里 0.5 来不及转。
      # 0.35 × sim_time 1.2 = 0.42m 前瞻，短于实测的 0.5m 墙距。
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      # 采样数从 20 提到 25，速度离散更细，走起来更顺
      vx_samples: 25
      vy_samples: 5
      vtheta_samples: 25
      # 1.7s 的预测时域太长：1.7s 内的代价全算进来，
      # 窄处容易提前判死而减速/绕路。1.2s 更果断。
      sim_time: 1.2
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      # 0.25 m/s 才认为"停住"太粗糙，会拖慢到点判定
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # 【关键】实测评价结果：
      #   原地转  vx=0      BaseObstacle=0    total=26.50
      #   前进    vx=0.367  BaseObstacle=186  total=26.58
      # 前方 186 的障碍代价只让总分高 0.08 —— scale 归一化后约 0.002，
      # 而 GoalAlign/GoalDist 每项贡献 12+。障碍权重必须提到同量级，
      # DWB 才会真正“怕墙”。3.0 与 12~24 处于同一数量级。
      BaseObstacle.scale: 3.0
      # 【为什么会"距离弯道 1m 就提前转弯"】
      # 实测 /evaluation：
      #   GoalAlign raw=43  GoalDist raw=42   ← 指向「目标」
      #   PathAlign raw=2   PathDist  raw=0    ← 指向「路径」
      # Goal 系列完全压过 Path 系列。长路径上目标永远在弯道之后，
      # 于是车提前朝目标方向转，而不是跟着路径走。
      #
      # Goal* 本来只该在接近终点时起作用。降到 3，
      # 并把 Path* 提上去，让「沿路径」成为主导约束。
      #
      # forward_point_distance 保持 0.1：设 0.2 时 S 弯的参考点会
      # 跨到下一段，同样导致提前转向。
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 3.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 3.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.21, 0.18], [0.21, -0.18], [-0.21, -0.18], [-0.21, 0.18]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 【调参历程】
        #   0.55 (TurtleBot 默认) -> 太保守，窄处绕远
        #   0.28                  -> 又太贴墙：车身半宽 0.21，只多 7cm，
        #                            NavFn 把路径规划进膨胀区，车沿路径走就撞墙
        #   0.35 = 半宽 0.21 + 0.14 余量。路径能离墙足够远，
        #          0.70m 宽通道仍可通过。
        cost_scaling_factor: 5.0
        inflation_radius: 0.35
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      footprint: "[[0.21, 0.18], [0.21, -0.18], [-0.21, -0.18], [-0.21, 0.18]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 与 local_costmap 保持一致（0.35）。
        # 两者不一致时，全局按 global 的膨胀规划、局部按 local 的膨胀避障，
        # 会出现“路径看着能走、DWB 却认为要撞”的矛盾。
        cost_scaling_factor: 5.0
        inflation_radius: 0.35
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # 0.5 太松：目标点在障碍里也能"规划成功"到 0.5m 外
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    # 与底盘对齐（controllers.yaml 的 1.5 rad/s、1.5 rad/s^2）
    max_rotational_vel: 1.5
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"

    # 【线速度x, 线速度y, 角速度z】
    # 原值是 nav2 默认的 TurtleBot 值(0.26 / 1.0)，比这个底盘的能力
    # (diff_drive_controller 里 0.5 / 1.5) 小一半，会把导航和遥控都拖慢。
    # 这里与 controllers.yaml 的限幅对齐。
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.5, 0.0, -1.5]

    # 加速度同样与底盘对齐（0.5 m/s^2、1.5 rad/s^2）。
    # 平滑器先限一道，diff_drive_controller 再限一道，两道保持一致
    # 才不会出现“平滑器允许但控制器拒绝”的隐形降速。
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]

    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
