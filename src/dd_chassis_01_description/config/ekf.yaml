ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1

    # ============================================================
    # 双输入源，分工明确，避免同一物理量被两个信源同时提供（会发散）
    #   轮速里程计 -> 只提供 vx（线速度）
    #   IMU        -> 只提供 yaw（姿态）和 vyaw（角速度）
    # ============================================================

    # odom0_config 的 15 个分量顺序：
    #   [x, y, z,
    #    roll, pitch, yaw,
    #    vx, vy, vz,
    #    vroll, vpitch, vyaw,
    #    ax, ay, az]
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,   # 只取 vx
                   false, false, false,   # 不取 vyaw，交给 IMU
                   false, false, false]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,     # 取 yaw 姿态
                  false, false, false,
                  false, false, true,     # 取 vyaw 角速度
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    # 差速车：只有 x 平移 + yaw 旋转，强制 z/roll/pitch 为 0
    two_d_mode: true

    # 输出 odom -> base_footprint。注意必须是 odom，
    # 设成 map 会和 slam_toolbox 抢 map->odom 的发布权。
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
